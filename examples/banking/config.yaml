# Local demo configuration. Tokens below are development placeholders.
# They are loaded only when AKF_DEV=1. Production tokens come from token_env.
http_addr: ":8080"
workspace:
  workspace_id: banking-demo
  display_name: Banking demo
  knowledge_owner: dipjyotimetia
  knowledge_repo: knowledge-factory-demo-knowledge
  knowledge_root: examples/banking/fixture-knowledge
  default_branch: main
  retention_days: 30
tokens:
  - token_env: AKF_AGENT_TOKEN
    workspace_id: banking-demo
    role: agent
    actor_id: banking-qe
  - token_env: AKF_CURATOR_TOKEN
    workspace_id: banking-demo
    role: curator
    actor_id: banking-operator
dev_tokens:
  - token: dev-agent-banking
    workspace_id: banking-demo
    role: agent
    actor_id: banking-qe
  - token: dev-curator-banking
    workspace_id: banking-demo
    role: curator
    actor_id: banking-operator
stdio:
  actor_id: banking-qe
traces:
  operator_actor_id: banking-operator
  run_owners:
    run-qe-1: banking-qe
sources:
  - id: distributed-systems
    provider: github
    owner: dipjyotimetia
    repo: distributed-systems
    pin_sha: 8e6680d683ac728f0f089bd60e4a96576ab4ed45
    credential_ref: env:GITHUB_READONLY_TOKEN
    allow_hosts:
      - api.github.com
    allow_paths:
      - contracts/avro/
    paths:
      - contracts/avro/README.md
      - contracts/avro/movement-lifecycle-event.avsc
    classification:
      contracts/avro/: contract
curation:
  rules:
    - movement-dedupe-key
  max_source_fetches: 20
  max_model_calls: 4
  max_tokens: 8000
  cases: examples/banking/tests/cases.json

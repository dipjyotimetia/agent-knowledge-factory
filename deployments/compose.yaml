# Local dependencies for the Agent Knowledge Factory.
# Temporal uses its own Postgres so its schema cannot collide with the
# factory database. The factory database is Postgres 18.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: akf
      POSTGRES_PASSWORD: akf
      POSTGRES_DB: akf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akf -d akf"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8088:8080"

  factoryd:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      AKF_INSTALLER_DATABASE_URL: postgres://akf:akf@postgres:5432/akf?sslmode=disable
      AKF_DATABASE_URL: postgres://akf_app:akf@postgres:5432/akf?sslmode=disable
      AKF_HTTP_ADDR: ":8080"
      AKF_DEV: "1"
      AKF_CONFIG: /workspace/examples/banking/config.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: knowledge-curator
    volumes:
      - ..:/workspace:ro
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"

  # factoryd -mcp serves HTTP and MCP on stdio in one process.
  # Attach a client with: docker compose run --rm -i --service-ports factoryd-mcp
  factoryd-mcp:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    working_dir: /workspace
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      AKF_INSTALLER_DATABASE_URL: postgres://akf:akf@postgres:5432/akf?sslmode=disable
      AKF_DATABASE_URL: postgres://akf_app:akf@postgres:5432/akf?sslmode=disable
      AKF_HTTP_ADDR: ":8081"
      AKF_DEV: "1"
      AKF_CONFIG: /workspace/examples/banking/config.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: knowledge-curator
    volumes:
      - ..:/workspace:ro
    tmpfs:
      - /tmp
    ports:
      - "8081:8081"
    command: ["-mcp"]

  factory-worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    working_dir: /workspace
    entrypoint: ["/factory-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      AKF_DATABASE_URL: postgres://akf_app:akf@postgres:5432/akf?sslmode=disable
      AKF_DEV: "1"
      AKF_CONFIG: /workspace/examples/banking/config.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: knowledge-curator
    volumes:
      - ..:/workspace:ro
    tmpfs:
      - /tmp

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ["otel"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  pgdata:

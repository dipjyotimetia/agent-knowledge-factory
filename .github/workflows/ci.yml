name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: akf
          POSTGRES_PASSWORD: akf
          POSTGRES_DB: akf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akf -d akf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AKF_TEST_ADMIN_DSN: postgres://akf:akf@127.0.0.1:5432/akf?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 -p 1 ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" -fmt text -quiet ./...

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          upload-artifact: true

  temporal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: akf
          POSTGRES_PASSWORD: akf
          POSTGRES_DB: akf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akf -d akf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      temporal:
        image: temporalio/auto-setup:1.29.1
        env:
          DB: postgres12
          DB_PORT: "5432"
          POSTGRES_USER: akf
          POSTGRES_PWD: akf
          POSTGRES_SEEDS: postgres
        ports:
          - 7233:7233
    env:
      AKF_TEST_ADMIN_DSN: postgres://akf:akf@127.0.0.1:5432/akf?sslmode=disable
      TEMPORAL_ADDRESS: 127.0.0.1:7233
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
      - name: wait for temporal
        run: |
          for _ in $(seq 1 90); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/7233' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "temporal did not accept connections"
          exit 1
      - name: full loop on Temporal
        run: go test -race -count=1 -p 1 -run TestLiveTemporalLoop ./internal/demo/

  github-sandbox:
    if: vars.RUN_GITHUB_SANDBOX == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: owner credentials required
        env:
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
        run: |
          test -n "$GITHUB_APP_ID"
          test -n "$GITHUB_APP_INSTALLATION_ID"
          test -n "$GITHUB_APP_PRIVATE_KEY"
          test -n "$GITHUB_WEBHOOK_SECRET"
          echo "GitHub App credentials are present. Point factory-worker at the knowledge repository before a live run."

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: akf
          POSTGRES_PASSWORD: akf
          POSTGRES_DB: akf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akf -d akf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AKF_TEST_ADMIN_DSN: postgres://akf:akf@127.0.0.1:5432/akf?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
